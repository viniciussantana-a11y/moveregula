<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - MoveRegula</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #27AE60 0%, #3498DB 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #27AE60;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        p {
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 16px;
        }
        
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }
        
        #qrcode canvas {
            border: 2px solid #27AE60;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-download {
            background: #27AE60;
            color: white;
        }
        
        .btn-download:hover {
            background: #1e8449;
            transform: translateY(-2px);
        }
        
        .btn-print {
            background: #3498DB;
            color: white;
        }
        
        .btn-print:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .info {
            background: #e8f8f0;
            padding: 15px;
            border-radius: 10px;
            margin-top: 25px;
            font-size: 14px;
            color: #27AE60;
            border-left: 4px solid #27AE60;
        }
        
        .url-display {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            color: #2C3E50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏃 MoveRegula</h1>
        <h2 style="color: #7f8c8d; font-size: 20px; margin-bottom: 25px;">QR Code para App</h2>
        
        <p>Escaneie o QR Code abaixo para acessar o app MoveRegula:</p>
        
        <div id="qrcode"></div>
        
        <div class="url-display">
            https://moveregula.app
        </div>
        
        <div class="button-group">
            <button class="btn-download" onclick="downloadQR()">⬇️ Download PNG</button>
            <button class="btn-print" onclick="printQR()">🖨️ Imprimir</button>
        </div>
        
        <div class="info">
            💡 <strong>Dica:</strong> Use este QR code em materiais de apresentação, pôsteres ou documentação impressa.
        </div>
    </div>
    
    <script>
        // Gerar QR code
        new QRCode(document.getElementById("qrcode"), {
            text: "https://moveregula.app",
            width: 300,
            height: 300,
            colorDark: "#27AE60",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
        
        function downloadQR() {
            const canvas = document.querySelector("#qrcode canvas");
            const link = document.createElement("a");
            link.href = canvas.toDataURL("image/png");
            link.download = "qrcode_moveregula.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        function printQR() {
            const canvas = document.querySelector("#qrcode canvas");
            const printWindow = window.open();
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>QR Code - MoveRegula</title>
                    <style>
                        body { text-align: center; padding: 20px; }
                        h1 { color: #27AE60; }
                        img { max-width: 400px; margin: 30px 0; }
                        p { color: #7f8c8d; font-size: 16px; }
                    </style>
                </head>
                <body>
                    <h1>🏃 MoveRegula</h1>
                    <p>QR Code para App</p>
                    <img src="${canvas.toDataURL("image/png")}" />
                    <p>https://moveregula.app</p>
                </body>
                </html>
            `);
            printWindow.document.close();
            setTimeout(() => printWindow.print(), 250);
        }
    </script>
</body>
</html>
